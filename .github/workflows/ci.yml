name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install pytest pytest-cov ruff mypy pydantic fastapi httpx
      - name: Lint
        run: ruff check src indexer api web evals tests
      - name: Type check
        run: mypy --strict src indexer api web evals tests
      - name: Test
        run: pytest --cov=pmcursor --cov=api --cov=web --cov-report=term-missing --cov-fail-under=80
      - name: Validate plugin
        run: python -m pmcursor.cli validate-plugin --repo .
      - name: Run eval
        run: python -m pmcursor.cli eval --json

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t pmcursor-ci .
      - name: Smoke check image
        run: docker run --rm --entrypoint python3 pmcursor-ci -c "import pmcursor; import api.server"

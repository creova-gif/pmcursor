name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install pytest ruff mypy pydantic fastapi httpx
      - name: Lint
        run: ruff check src indexer api web evals tests
      - name: Type check
        run: mypy --strict src indexer api web evals tests
      - name: Test
        run: pytest
      - name: Validate plugin
        run: python -m pmcursor.cli validate-plugin --repo .
      - name: Run eval
        run: python -m pmcursor.cli eval --json

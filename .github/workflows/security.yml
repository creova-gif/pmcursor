name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools and project dependencies
        run: pip install -e '.[server]' ruff pip-audit
      - name: Run Ruff security rules (Bandit)
        run: ruff check --select S src indexer api web
      - name: Run pip-audit
        run: pip-audit --progress-spinner off

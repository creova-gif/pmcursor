name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test dependencies
        run: pip install build pytest ruff mypy pydantic fastapi httpx
      - name: Lint
        run: ruff check src indexer api web evals tests
      - name: Type check
        run: MYPYPATH=src mypy --strict src indexer api web evals tests
      - name: Test
        run: PYTHONPATH=src:. pytest
      - name: Validate plugin
        run: PYTHONPATH=src python -m pmcursor.cli validate-plugin --repo .
      - name: Run eval
        run: PYTHONPATH=src python -m pmcursor.cli eval --json
      - name: Build package
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

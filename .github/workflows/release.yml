name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install build and test dependencies
        run: pip install build pytest ruff mypy pydantic fastapi httpx
      - name: Lint
        run: ruff check src indexer api web evals tests
      - name: Type check
        run: MYPYPATH=src mypy --strict src indexer api web evals tests
      - name: Test
        run: PYTHONPATH=src:. pytest
      - name: Validate plugin
        run: PYTHONPATH=src python -m pmcursor.cli validate-plugin --repo .
      - name: Run eval
        run: PYTHONPATH=src python -m pmcursor.cli eval --json
      - name: Build package
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/*
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: dist/*
          generate_release_notes: true

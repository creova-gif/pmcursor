[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmcursor"
version = "0.1.0"
description = "Codebase-Aware AI IDE & Cursor/GStack Plugin for Product Managers"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[project.scripts]
pmcursor = "pmcursor.cli:main"

[tool.setuptools]
packages = ["pmcursor", "api", "web", "indexer"]
package-dir = { pmcursor = "src/pmcursor", api = "api", web = "web", indexer = "indexer" }
include-package-data = true

[tool.setuptools.package-data]
pmcursor = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmcursor"
version = "0.3.0"
description = "Codebase-Aware AI IDE & Cursor/GStack Plugin for Product Managers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Justin Mafie" }]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/creova-gif/pmcursor"
Repository = "https://github.com/creova-gif/pmcursor"
Issues = "https://github.com/creova-gif/pmcursor/issues"
Changelog = "https://github.com/creova-gif/pmcursor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
llm = ["anthropic>=2.0"]
bigquery = ["google-cloud-bigquery>=3.25"]
github-app = ["PyJWT[crypto]>=2.8"]

[project.scripts]
pmcursor = "pmcursor.cli:main"

[tool.setuptools]
packages = ["pmcursor", "api", "web", "indexer"]
package-dir = { pmcursor = "src/pmcursor", api = "api", web = "web", indexer = "indexer" }
include-package-data = true

[tool.setuptools.package-data]
pmcursor = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
# `anthropic` is an optional extra ([project.optional-dependencies] llm); the
# SDK ships py.typed but is not installed in base/CI environments.
module = "anthropic"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `google-cloud-bigquery` is an optional extra ([project.optional-dependencies]
# bigquery); not installed in base/CI environments.
module = ["google", "google.cloud", "google.cloud.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `PyJWT` is an optional extra ([project.optional-dependencies] github-app);
# not installed in base/CI environments.
module = "jwt"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
